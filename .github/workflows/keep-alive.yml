name: Keep API awake

# Render's free plan sleeps after 15 idle minutes. A ping every 10 keeps it up.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: vars.API_URL != ''
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.API_URL }}/health"
