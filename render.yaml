services:
  # ---------------------------------
  # 1. The FastAPI Backend (Docker)
  # ---------------------------------
  - type: web
    name: bnb-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8000
      # These must be filled securely in the Render Dashboard after deployment
      - key: MONGODB_URI
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      # Automatically sets CORS origin to the URL of your deployed frontend
      - key: FRONTEND_URL
        fromService:
          type: web
          name: bnb-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ---------------------------------
  # 2. The Next.js Frontend (Node)
  # ---------------------------------
  - type: web
    name: bnb-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      # Automatically connects the frontend to your deployed backend URL
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: bnb-backend
          envVarKey: RENDER_EXTERNAL_URL
