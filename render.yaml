services:
  - type: web
    name: audira-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_URL
        value: https://audira-ai.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://audira-.*-vishnudatta510s-projects\.vercel\.app
      - key: MONGODB_URI
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
